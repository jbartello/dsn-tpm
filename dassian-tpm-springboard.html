<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dassian Total Program Management (TPM)</title>
<style>
  :root {
    --sap-blue: #0a6ed1;
    --sap-blue-dark: #085caf;
    --shell-bg: #354a5f;
    --panel-border: #d9d9d9;
    --text: #32363a;
    --text-muted: #6a6d70;
    --section-bg: #f7f7f7;
    --nav-bg: #fafafa;
    --good: #107e3e;
    --warn: #e9730c;
    --bad: #bb0000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "72", "72full", Arial, Helvetica, sans-serif;
    color: var(--text);
    background: #fff;
    font-size: 14px;
  }

  /* ---------- Shell header bar ---------- */
  .shellbar {
    display: flex;
    align-items: center;
    height: 44px;
    background: var(--shell-bg);
    color: #fff;
    padding: 0 12px;
    gap: 14px;
  }
  .shellbar .back { font-size: 18px; opacity: .85; cursor: pointer; }
  .sap-logo {
    font-weight: 700;
    font-style: italic;
    letter-spacing: 1px;
    background: #1a73c0;
    color: #fff;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 16px;
  }
  .shellbar .title {
    font-size: 15px;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .shellbar .title .chev { font-size: 11px; opacity: .8; }
  .shellbar .spacer { flex: 1; }
  .shellbar .icon { font-size: 16px; opacity: .9; cursor: pointer; }
  .shellbar .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--sap-blue);
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.4);
  }

  /* ---------- Body layout ---------- */
  .layout { display: flex; height: calc(100vh - 44px); }

  /* ---------- Left nav ---------- */
  .sidenav {
    width: 248px;
    min-width: 248px;
    border-right: 1px solid var(--panel-border);
    background: var(--nav-bg);
    display: flex; flex-direction: column;
  }
  .sidenav .nav-header {
    padding: 14px 16px 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-muted);
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
    color: var(--text);
    font-size: 14px;
  }
  .nav-item .nav-ico { font-size: 17px; width: 20px; text-align: center; color: var(--text-muted); }
  .nav-item:hover { background: #f0f3f6; }
  .nav-item.active {
    background: #eaf2fb;
    border-left-color: var(--sap-blue);
    color: var(--sap-blue);
    font-weight: 700;
  }
  .nav-item.active .nav-ico { color: var(--sap-blue); }
  .sidenav .nav-foot {
    margin-top: auto;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--panel-border);
  }

  /* ---------- Main content ---------- */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-left: 3px solid var(--sap-blue); }
  .section-bar {
    display: flex; align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid var(--panel-border);
    background: #fff;
    gap: 16px;
  }
  .section-bar .sec-title { font-size: 17px; font-weight: 400; flex: 1; }
  .section-bar .prog-pick {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-muted); font-size: 13px;
  }
  .section-bar select {
    font-family: inherit; font-size: 13px;
    border: 1px solid #c4c4c4; border-radius: 4px;
    padding: 5px 8px; color: var(--text); background: #fff;
  }
  .content { flex: 1; overflow-y: auto; padding: 22px 28px; background: var(--section-bg); }

  .module-intro { color: var(--text-muted); margin: 0 0 18px; font-size: 14px; }

  /* ---------- KPI tiles ---------- */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .tile {
    background: #fff;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 16px 18px;
    min-height: 110px;
    display: flex; flex-direction: column;
  }
  .tile .t-label { font-size: 13px; color: var(--text-muted); }
  .tile .t-value { font-size: 28px; font-weight: 300; margin: 8px 0 4px; }
  .tile .t-sub { font-size: 12px; color: var(--text-muted); margin-top: auto; }
  .t-value.good { color: var(--good); }
  .t-value.warn { color: var(--warn); }
  .t-value.bad { color: var(--bad); }
  .delta { font-size: 12px; font-weight: 700; }
  .delta.good { color: var(--good); }
  .delta.bad { color: var(--bad); }

  /* ---------- Cards / panels ---------- */
  .card {
    background: #fff;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .card .card-head {
    display: flex; align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid #ededed;
    font-size: 15px;
  }
  .card .card-head .ch-title { flex: 1; }
  .card .card-body { padding: 16px 18px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--sap-blue);
    color: var(--sap-blue);
    background: #fff;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: #eaf2fb; }
  .btn.primary { background: var(--sap-blue); color: #fff; }
  .btn.primary:hover { background: var(--sap-blue-dark); }

  /* ---------- Tables ---------- */
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th {
    text-align: left; font-weight: 700; font-size: 13px;
    color: var(--text); padding: 11px 14px;
    border-bottom: 1px solid var(--panel-border);
  }
  table.grid td {
    padding: 11px 14px; border-bottom: 1px solid #ededed; font-size: 13px;
  }
  table.grid tr:hover td { background: #f7faff; }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 700;
  }
  .pill.good { background: #e3f4ea; color: var(--good); }
  .pill.warn { background: #fcefe3; color: var(--warn); }
  .pill.bad  { background: #fbe5e5; color: var(--bad); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .link { color: var(--sap-blue); cursor: pointer; text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* ---------- Simple bar chart ---------- */
  .bars { display: flex; align-items: flex-end; gap: 18px; height: 180px; padding: 10px 6px 0; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar { width: 60%; border-radius: 4px 4px 0 0; }
  .bar-lbl { font-size: 12px; color: var(--text-muted); }
  .placeholder-note {
    background: #fff8e6; border: 1px solid #f4d77a; color: #7a5c00;
    border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px;
  }

  /* ---------- Project Values: KPI / filter strip ---------- */
  .filter-strip {
    display: flex; gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .kpi-strip {
    display: flex; gap: 14px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 22px;
  }
  .kpi-card {
    background: #fff;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px 14px 14px;
    min-width: 132px;
    flex: 0 0 auto;
    display: flex; flex-direction: column;
  }
  .kpi-card.filter { min-width: 168px; }
  .kpi-card .k-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .kpi-card .k-label { font-size: 13px; color: var(--text); white-space: nowrap; }
  .kpi-card .k-funnel { color: var(--text-muted); font-size: 12px; cursor: pointer; }
  .kpi-card .k-body { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .kpi-card .k-icon { color: #6a7c8c; flex: 0 0 auto; display: flex; }
  .kpi-card .k-val { font-size: 26px; font-weight: 300; color: var(--text); line-height: 1; }
  .kpi-card select {
    font-family: inherit; font-size: 13px; margin-top: 12px;
    border: 1px solid #c4c4c4; border-radius: 4px; padding: 6px 8px;
    color: var(--text); background: #fff; width: 100%;
  }

  /* ---------- Control Account Summary ---------- */
  .ca-head {
    display: flex; align-items: center; gap: 12px;
    margin: 4px 0 8px;
  }
  .ca-head .ca-title { font-size: 15px; flex: 1; }
  .ca-head .ca-tool { color: var(--sap-blue); cursor: pointer; font-size: 15px; }
  .ca-wrap {
    background: #fff; border: 1px solid var(--panel-border); border-radius: 8px;
    overflow-x: auto;
  }
  table.ca { border-collapse: collapse; width: 100%; white-space: nowrap; }
  table.ca th {
    text-align: left; font-weight: 700; font-size: 12px; color: var(--text);
    padding: 10px 12px; border-bottom: 1px solid var(--panel-border);
    background: #fafafa; position: sticky; top: 0;
  }
  table.ca th .sort { color: #b0b0b0; font-size: 10px; margin-left: 3px; }
  table.ca th .sort.active { color: var(--sap-blue); font-size: 11px; }
  table.ca th.sortable { cursor: pointer; user-select: none; }
  table.ca th.sortable:hover { background: #eef3f8; }
  table.ca th.r { text-align: right; }
  .kpi-card .k-val.good { color: var(--good); }
  .kpi-card .k-val.warn { color: var(--warn); }
  .kpi-card .k-val.bad  { color: var(--bad); }
  table.ca td {
    padding: 9px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px;
  }
  table.ca td.r { text-align: right; font-variant-numeric: tabular-nums; }
  table.ca tr:hover td { background: #f7faff; }
  table.ca td.lnk { color: var(--sap-blue); }

  /* ---------- Project Values: charts row ---------- */
  .charts-row { display: flex; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .chart-card {
    flex: 1 1 320px;
    background: #fff; border: 1px solid var(--panel-border); border-radius: 8px;
    display: flex; flex-direction: column;
  }
  .chart-card .cc-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid #ededed; font-size: 15px;
  }
  .chart-card .cc-note { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .chart-card .cc-body { padding: 18px; flex: 1; display: flex; align-items: center; justify-content: center; }

  /* donut */
  .donut-wrap { display: flex; align-items: center; gap: 22px; }
  .donut-legend { font-size: 13px; color: var(--text-muted); line-height: 1.9; }
  .donut-legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: middle; }

  /* two-bar chart */
  .bar2 { display: flex; align-items: flex-end; justify-content: center; gap: 52px; height: 210px; padding-top: 8px; width: 100%; }
  .b2col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .b2val { font-size: 14px; margin-bottom: 7px; color: var(--text); font-variant-numeric: tabular-nums; }
  .b2bar { width: 74px; border-radius: 4px 4px 0 0; min-height: 2px; }
  .b2lbl { margin-top: 8px; font-size: 13px; color: var(--text-muted); }

  /* ---------- Project Reports: stacked EVM charts ---------- */
  .report-charts { display: flex; flex-direction: column; gap: 18px; }
  .rc-card { background: #fff; border: 1px solid var(--panel-border); border-radius: 8px; }
  .rc-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid #ededed; font-size: 15px;
  }
  .rc-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .rc-body { padding: 14px 18px 16px; overflow-x: auto; }
  svg.chart { display: block; width: 100%; height: auto; font-family: inherit; }
  svg.chart text { font-size: 11px; fill: var(--text-muted); }
  .rc-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-top: 10px; padding-left: 6px; }
  .rc-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .rc-legend .ln { width: 18px; border-top: 3px solid; display: inline-block; }
  .rc-legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  svg.chart [data-tip] { cursor: pointer; }
  #chartTip {
    position: fixed; display: none; z-index: 1000; pointer-events: none;
    background: #32363a; color: #fff; font-size: 12px; line-height: 1.4;
    padding: 6px 9px; border-radius: 4px; white-space: nowrap;
    box-shadow: 0 2px 10px rgba(0,0,0,.28);
  }
  .rc-legend .lg.toggle { cursor: pointer; user-select: none; }
  .rc-legend .lg.toggle:hover { color: var(--text); }
  .rc-legend .lg.off { opacity: .35; text-decoration: line-through; }

  /* ---------- Risk Information: embedded register ---------- */
  .risk-embed-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .risk-embed-bar .ch-title { font-size: 16px; }
  .risk-frame { width: 100%; height: calc(100vh - 185px); border: 1px solid var(--panel-border); border-radius: 8px; background: #fff; display: block; }
</style>
</head>
<body>

  <!-- Shell bar -->
  <div class="shellbar">
    <span class="back">‹</span>
    <span class="sap-logo">SAP</span>
    <span class="title">Dassian Total Program Management <span class="chev">▾</span></span>
    <span class="spacer"></span>
    <span class="icon">🔍</span>
    <span class="icon">🔔</span>
    <span class="avatar">JB</span>
  </div>

  <div class="layout">
    <!-- Left navigation -->
    <nav class="sidenav">
      <div class="nav-header">Total Program Management</div>
      <div class="nav-item" data-mod="values"   onclick="setModule('values')">
        <span class="nav-ico">📊</span> Project Values</div>
      <div class="nav-item" data-mod="reports"  onclick="setModule('reports')">
        <span class="nav-ico">📄</span> Project Reports</div>
      <div class="nav-item" data-mod="risk"     onclick="setModule('risk')">
        <span class="nav-ico">⚠️</span> Risk Information</div>
      <div class="nav-item" data-mod="analysis" onclick="setModule('analysis')">
        <span class="nav-ico">📈</span> Project Analysis</div>
      <div class="nav-foot">Prototype · v0.1</div>
    </nav>

    <!-- Main content -->
    <section class="main">
      <div class="section-bar">
        <div class="sec-title" id="secTitle">Project Values</div>
        <div class="prog-pick">
          <span>Program:</span>
          <select id="progSelect" onchange="onProgramChange()">
            <option value="DEMO">Demo</option>
            <option value="MFG" selected>MFG Program</option>
          </select>
        </div>
      </div>

      <div class="content" id="content"><!-- module renders here --></div>
    </section>
  </div>

<script>
  /* ---------------------------------------------------------------
     Demo program data. All placeholder figures — swap for real
     PPC data sources as we build each module out.
  --------------------------------------------------------------- */
  // A Program owns one or more Projects (project = the DD*/JTB001 ids in CA_ROWS).
  // values{} are program-level cockpit figures (USD millions) used by the
  // Analysis / Risk modules; the Project Values module computes from CA_ROWS.
  const PROGRAMS = {
    'DEMO': {
      name: 'Demo',
      projects: ['JTB001'],
      values: { bac: 2.35, eac: 2.32, etc: 1.89, acwp: 0.45,
                cpi: 0.97, spi: 0.93, cv: -0.01, sv: -0.03, funding: 2.40 },
    },
    'MFG': {
      name: 'MFG Program',
      projects: ['DD-0010', 'DD-0001', 'DD-0002', 'DD-0003'],
      values: { bac: 485.2, eac: 493.0, etc: 240.0, acwp: 9.10,
                cpi: 0.96, spi: 0.93, cv: -0.40, sv: -0.20, funding: 500.0 },
    },
  };

  const MODULE_TITLES = {
    values:   'Project Values',
    reports:  'Project Reports',
    risk:     'Risk Information',
    analysis: 'Project Analysis',
  };

  let currentModule = 'values';

  function progId() { return document.getElementById('progSelect').value; }
  function prog() { return PROGRAMS[progId()]; }

  // Program changed: project/CAM lists differ per program, so clear the
  // in-module filters and sort before re-rendering.
  function onProgramChange() {
    pvState.project = ''; pvState.cam = ''; pvState.sortCol = null; pvState.sortDir = 1;
    render();
  }
  const money = n => '$' + n.toFixed(2) + 'M';
  const cls = (v, goodWhenPositive = true) => {
    if (v === 0) return '';
    const positive = v > 0;
    return (positive === goodWhenPositive) ? 'good' : 'bad';
  };

  /* ---------------------- Module renderers ---------------------- */

  // Small banknote/value icon used on the monetary KPI cards
  const MONEY_ICO = '<svg class="k-icon" width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">'
    + '<rect x="0.6" y="0.6" width="20.8" height="14.8" rx="1.6" stroke="currentColor" stroke-width="1.2"/>'
    + '<circle cx="11" cy="8" r="2.6" stroke="currentColor" stroke-width="1.2"/>'
    + '<circle cx="3.6" cy="8" r="0.9" fill="currentColor"/>'
    + '<circle cx="18.4" cy="8" r="0.9" fill="currentColor"/></svg>';
  const FUNNEL = '<span class="k-funnel">▽</span>';

  // Column metadata for the Control Account Summary table.
  // num = numeric (right-aligned + sorts numerically); link = SAP-blue value.
  const PV_COLS = [
    { key: 'Project definition' },
    { key: 'projectdescription' },
    { key: 'WBS Element' },
    { key: 'Control Account Description' },
    { key: 'Control Account Manager' },
    { key: 'Planned Value', num: true, link: true },
    { key: 'Earned Value',  num: true, link: true },
    { key: 'Actual Cost',   num: true, link: true },
    { key: 'currenSV',  num: true },
    { key: 'currentCV', num: true },
    { key: 'cumSV',     num: true },
    { key: 'cumCV',     num: true },
    { key: 'SPI', num: true },
    { key: 'CPI', num: true },
    { key: 'BAC', num: true, link: true },
    { key: 'EAC', num: true, link: true },
    { key: 'VAC', num: true },
  ];

  // Project Values UI state (kept in JS so re-renders preserve it)
  const pvState = { project: '', cam: '', wbs: '', period: '2026-05', sortCol: null, sortDir: 1 };

  // Add thousands separators while preserving the original decimals/sign.
  function addCommas(s) {
    if (s === '' || s == null) return s;
    const neg = String(s).startsWith('-');
    const t = neg ? String(s).slice(1) : String(s);
    const parts = t.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + parts.join('.');
  }
  const num = s => parseFloat(s) || 0;
  const fmtM = n => (n / 1e6).toFixed(1) + 'M';   // millions, 1 decimal (no $, matches D23)

  // Month-end periods. The stored CA_ROWS values represent the latest period
  // (May, factor 1.0 — matches the D23 screenshot). Earlier periods scale the
  // time-phased figures (Planned / Earned / Actual) independently so SPI/CPI and
  // % complete shift period to period. BAC/EAC/VAC are at-completion figures and
  // stay constant. Simulated until linked to SAP period data.
  const PERIODS = [
    { id: '2025-12', label: 'Dec 2025', f: { plan: 0.20, earn: 0.14, act: 0.16 } },
    { id: '2026-01', label: 'Jan 2026', f: { plan: 0.36, earn: 0.28, act: 0.31 } },
    { id: '2026-02', label: 'Feb 2026', f: { plan: 0.54, earn: 0.44, act: 0.49 } },
    { id: '2026-03', label: 'Mar 2026', f: { plan: 0.70, earn: 0.61, act: 0.66 } },
    { id: '2026-04', label: 'Apr 2026', f: { plan: 0.86, earn: 0.80, act: 0.83 } },
    { id: '2026-05', label: 'May 2026', f: { plan: 1.00, earn: 1.00, act: 1.00 } },
  ];
  const PERIOD_MAP = Object.fromEntries(PERIODS.map(p => [p.id, p]));

  // Recompute a control-account row for the selected month-end period.
  function pvApplyPeriod(row) {
    const f = (PERIOD_MAP[pvState.period] || PERIOD_MAP['2026-05']).f;
    const planned = num(row[5]) * f.plan;
    const earned  = num(row[6]) * f.earn;
    const actual  = num(row[7]) * f.act;
    const curSV   = num(row[8]) * f.earn;
    const curCV   = num(row[9]) * f.earn;
    const cumSV   = earned - planned;
    const cumCV   = earned - actual;
    const spi = planned ? earned / planned : 0;
    const cpi = actual ? earned / actual : 0;
    const d2 = n => (Math.round(n * 100) / 100).toString();
    const d3 = n => (Math.round(n * 1000) / 1000).toString();
    return [ row[0], row[1], row[2], row[3], row[4],
      d2(planned), d2(earned), d2(actual), d2(curSV), d2(curCV), d2(cumSV), d2(cumCV),
      d3(spi), d3(cpi), row[14], row[15], row[16] ];   // BAC / EAC / VAC unchanged
  }

  // Control Account Summary rows — transcribed from the D23 screen.
  // [Project, Description, WBS, CA Description, CAM, PlannedValue, EarnedValue,
  //  ActualCost, currenSV, currentCV, cumSV, cumCV, SPI, CPI, BAC, EAC, VAC]
  const DESC = 'CP,PPC,RAP,FPA,PACE,SIS MSP,FD Dmo Prj';
  const DEMO_DESC = 'PPC/SIS Demo 1';
  const CA_ROWS = [

  function kpiCard(label, value, withIcon, colorClass) {
    return `<div class="kpi-card">
        <div class="k-top"><span class="k-label">${label} **</span>${FUNNEL}</div>
        <div class="k-body">${withIcon ? MONEY_ICO : ''}<span class="k-val ${colorClass || ''}">${value}</span></div>
      </div>`;
  }

  // Variance-tolerance color bands (green = within tolerance, orange = watch, red = breach)
  const bandCPI = v => v >= 1 ? 'good' : v >= 0.95 ? 'warn' : 'bad';
  const bandSPI = v => v >= 1 ? 'good' : v >= 0.95 ? 'warn' : 'bad';
  const bandVAC = (vac, bac) => vac >= 0 ? 'good' : vac >= -0.05 * Math.abs(bac) ? 'warn' : 'bad';
  const bandEAC = (eac, bac) => eac <= bac ? 'good' : eac <= 1.05 * bac ? 'warn' : 'bad';

  // Rows belonging to the currently selected Program (its projects only)
  function pvProgramRows() {
    const set = new Set(prog().projects);
    return CA_ROWS.filter(r => set.has(r[0]));
  }
  function pvFilteredRows() {
    return pvProgramRows()
      .filter(r => (!pvState.project || r[0] === pvState.project) &&
                   (!pvState.cam     || r[4] === pvState.cam) &&
                   (!pvState.wbs     || r[2] === pvState.wbs))
      .map(pvApplyPeriod);
  }

  function pvSortedRows() {
    const rows = pvFilteredRows().slice();
    const c = pvState.sortCol;
    if (c == null) return rows;
    const numeric = PV_COLS[c].num;
    rows.sort((a, b) => {
      const r = numeric ? num(a[c]) - num(b[c]) : String(a[c]).localeCompare(String(b[c]));
      return r * pvState.sortDir;
    });
    return rows;
  }

  function pvKpis(rows) {
    const sum = i => rows.reduce((t, r) => t + num(r[i]), 0);
    const plan = sum(5), earned = sum(6), actual = sum(7),
          bac = sum(14), eac = sum(15), vac = sum(16);
    const cpi = actual ? earned / actual : 0;
    const spi = plan ? earned / plan : 0;
    return { plan, earned, actual, bac, eac, vac, cpi, spi };
  }

  // wired from the dropdowns' onchange
  function pvSetFilter(which, value) {
    pvState[which] = value;
    if (which === 'project') pvState.wbs = '';   // WBS list depends on project
    render();
  }
  function pvSort(col) {
    if (pvState.sortCol === col) pvState.sortDir *= -1;
    else { pvState.sortCol = col; pvState.sortDir = 1; }
    render();
  }

  // Placeholder % Complete keyed by program (no project filter) or project — links to SAP % Complete later
  const PV_PCT = { 'DEMO': 19, 'MFG': 37, 'JTB001': 19, 'DD-0010': 0, 'DD-0001': 52, 'DD-0002': 28, 'DD-0003': 9 };
  // Placeholder recurring share of cost — links to SAP REC / Non-REC fields later
  const PV_REC_RATIO = { 'DEMO': 0.58, 'MFG': 0.64, 'JTB001': 0.58, 'DD-0010': 0.50, 'DD-0001': 0.66, 'DD-0002': 0.62, 'DD-0003': 0.55 };

  function donutSvg(pct) {
    const r = 56, cx = 70, cy = 70, sw = 18;
    const circ = 2 * Math.PI * r;
    const off = circ * (1 - pct / 100);
    return `<svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e9e9e9" stroke-width="${sw}"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--sap-blue)" stroke-width="${sw}"
          stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
          stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
        <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="28" font-weight="300" fill="var(--text)">${pct}%</text>
        <text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="12" fill="var(--text-muted)">Complete</text>
      </svg>`;
  }

  function renderCharts(rows, k) {
    const key = pvState.project || progId();
    const pf = (PERIOD_MAP[pvState.period] || PERIOD_MAP['2026-05']).f.earn;
    const pct = Math.round((PV_PCT[key] ?? 37) * pf);
    const ratio = PV_REC_RATIO[key] ?? 0.64;
    const rec = k.bac * ratio, nonrec = k.bac * (1 - ratio);
    const maxv = Math.max(rec, nonrec, 1);
    const bh = v => Math.round((v / maxv) * 150) + 2;
    return `
      <div class="charts-row">
        <div class="chart-card">
          <div class="cc-head"><span>% Complete **</span><span class="cc-note">placeholder · SAP % Complete</span></div>
          <div class="cc-body">
            <div class="donut-wrap">
              ${donutSvg(pct)}
              <div class="donut-legend">
                <div><span class="dot" style="background:var(--sap-blue)"></span>Complete &nbsp;${pct}%</div>
                <div><span class="dot" style="background:#e9e9e9"></span>Remaining &nbsp;${100 - pct}%</div>
              </div>
            </div>
          </div>
        </div>
        <div class="chart-card">
          <div class="cc-head"><span>Cost by Type (BAC) **</span><span class="cc-note">placeholder · SAP REC / Non-REC</span></div>
          <div class="cc-body">

                <div class="b2bar" style="height:${bh(rec)}px;background:var(--sap-blue)"></div>
                <div class="b2lbl">REC</div>
              </div>
              <div class="b2col">
                <div class="b2val">${fmtM(nonrec)}</div>
                <div class="b2bar" style="height:${bh(nonrec)}px;background:#6b4ba8"></div>

              </div>
            </div>

        </div>

  }

  // Shared filter bar (Project / CAM / [WBS] / Month End). State lives in
  // pvState so selections persist across modules. WBS only shown when asked.
  function renderFilterBar(includeWbs) {
    const baseRows = pvProgramRows();
    const projects = [...new Set(baseRows.map(r => r[0]))];
    const cams = [...new Set(baseRows.map(r => r[4]).filter(Boolean))];
    const wbsRows = baseRows.filter(r => !pvState.project || r[0] === pvState.project);
    const wbsList = [...new Set(wbsRows.map(r => r[2]).filter(Boolean))];
    const opts = (list, sel) => '<option value="">(All)</option>' +
      list.map(o => `<option value="${o}" ${o === sel ? 'selected' : ''}>${o}</option>`).join('');
    const periodOpts = PERIODS.map(p =>
      `<option value="${p.id}" ${p.id === pvState.period ? 'selected' : ''}>${p.label}</option>`).join('');
    const card = (label, inner) =>
      `<div class="kpi-card filter"><div class="k-top"><span class="k-label">${label}</span>${FUNNEL}</div>${inner}</div>`;
    return `
      <div class="filter-strip">
        ${card('Project Filter', `<select onchange="pvSetFilter('project', this.value)">${opts(projects, pvState.project)}</select>`)}
        ${card('CAM Filter **', `<select onchange="pvSetFilter('cam', this.value)">${opts(cams, pvState.cam)}</select>`)}
        ${includeWbs ? card('WBS Filter **', `<select onchange="pvSetFilter('wbs', this.value)">${opts(wbsList, pvState.wbs)}</select>`) : ''}
        ${card('Month End **', `<select onchange="pvSetFilter('period', this.value)">${periodOpts}</select>`)}
      </div>`;
  }

  function renderValues(p) {
    const rows = pvSortedRows();
    const k = pvKpis(rows);
    const baseRows = pvProgramRows();

    // table headers with live sort indicator
    const headHtml = PV_COLS.map((col, i) => {
      const active = pvState.sortCol === i;
      const arrow = active
        ? `<span class="sort active">${pvState.sortDir === 1 ? '▲' : '▼'}</span>`
        : '<span class="sort">▲▼</span>';
      return `<th class="${col.num ? 'r' : ''} sortable" onclick="pvSort(${i})">${col.key}${arrow}</th>`;
    }).join('');

    // table body with commas + blue links
    const rowsHtml = rows.map(r => {
      const cells = PV_COLS.map((col, i) => {
        if (!col.num) return `<td>${r[i]}</td>`;
        return `<td class="r${col.link ? ' lnk' : ''}">${addCommas(r[i])}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');

    return `
      ${renderFilterBar(false)}
      <div class="kpi-strip">
        ${kpiCard('Plan Value', fmtM(k.plan), true)}
        ${kpiCard('Earned Value', fmtM(k.earned), true)}
        ${kpiCard('Actual Cost', fmtM(k.actual), true)}
        ${kpiCard('BAC', fmtM(k.bac), true)}
        ${kpiCard('EAC', fmtM(k.eac), false, bandEAC(k.eac, k.bac))}
        ${kpiCard('VAC', fmtM(k.vac), true, bandVAC(k.vac, k.bac))}
        ${kpiCard('CPI', k.cpi.toFixed(2), false, bandCPI(k.cpi))}
        ${kpiCard('SPI', k.spi.toFixed(2), false, bandSPI(k.spi))}
      </div>

      ${renderCharts(rows, k)}

      <div class="ca-head">
        <span class="ca-title">Control Account Summary **</span>
        <span class="ca-tool" title="Filter">▽</span>
        <span class="ca-tool" title="Export">⤓</span>
        <span style="color:var(--text-muted);font-size:13px">${rows.length} of ${baseRows.length}</span>
      </div>
      <div class="ca-wrap">
        <table class="ca">
          <thead><tr>${headHtml}</tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>`;
  }

  /* ===================== Project Reports: EVM charts ===================== */
  const _clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p, m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return m * p;
  }
  // currency formatter for axes/labels: $1.2M / $640K / -$120K
  function mfmt(v) {
    const a = Math.abs(v), sign = v < 0 ? '-' : '';
    return a >= 1e6 ? `${sign}$${(a / 1e6).toFixed(1)}M`
         : a >= 1e3 ? `${sign}$${(a / 1e3).toFixed(0)}K`
         : `${sign}$${a.toFixed(0)}`;
  }

  // Generic multi-line chart.
  function lineSVG(cfg) {
    const w = 680, h = cfg.h || 250, mL = 60, mR = 18, mT = 16, mB = 36;
    const pw = w - mL - mR, ph = h - mT - mB, xN = cfg.xN;
    const yFmt = cfg.yFmt || (v => v);
    const all = cfg.series.flatMap(s => s.pts.map(p => p.y)).filter(v => v != null)
      .concat((cfg.refLines || []).map(r => r.y));
    const yMin = cfg.yMin != null ? cfg.yMin : 0;
    const yMax = cfg.yMax != null ? cfg.yMax : niceMax(Math.max(...all, 1));
    const xPx = i => mL + (xN <= 1 ? pw / 2 : (i / (xN - 1)) * pw);
    const yPx = v => mT + ph - ((_clamp(v, yMin, yMax) - yMin) / ((yMax - yMin) || 1)) * ph;
    let s = '';
    (cfg.bands || []).forEach(b => {
      const y1 = yPx(b.y2), y2 = yPx(b.y1);
      s += `<rect x="${mL}" y="${y1}" width="${pw}" height="${Math.max(0, y2 - y1)}" fill="${b.color}"/>`;
    });
    for (let g = 0; g <= 4; g++) {
      const v = yMin + (yMax - yMin) * g / 4, y = yPx(v);
      s += `<line x1="${mL}" y1="${y}" x2="${mL + pw}" y2="${y}" stroke="#eee"/><text x="${mL - 8}" y="${y + 3}" text-anchor="end">${yFmt(v)}</text>`;
    }
    for (let i = 0; i < xN; i++)
      s += `<text x="${xPx(i)}" y="${mT + ph + 18}" text-anchor="middle">${cfg.xLabels[i] || ''}</text>`;
    if (cfg.statusX != null) {
      const x = xPx(cfg.statusX);
      s += `<line x1="${x}" y1="${mT}" x2="${x}" y2="${mT + ph}" stroke="#aaa" stroke-dasharray="3 3"/><text x="${x}" y="${mT - 4}" text-anchor="middle" fill="#999">Status</text>`;
    }
    (cfg.refLines || []).forEach(r => {
      const y = yPx(r.y);
      s += `<line x1="${mL}" y1="${y}" x2="${mL + pw}" y2="${y}" stroke="${r.color}" stroke-width="1.5" ${r.dash ? `stroke-dasharray="${r.dash}"` : ''}/>`;
    });
    cfg.series.filter(se => !(cfg.hidden && cfg.hidden.has(se.name))).forEach(se => {
      const vis = se.pts.filter(p => p.y != null);
      const poly = vis.map(p => `${xPx(p.x).toFixed(1)},${yPx(p.y).toFixed(1)}`).join(' ');
      s += `<polyline points="${poly}" fill="none" stroke="${se.color}" stroke-width="2.5" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/>`;
      vis.forEach(p => {
        const cx = xPx(p.x).toFixed(1), cy = yPx(p.y).toFixed(1);
        const tip = `${se.name ? se.name + ' · ' : ''}${cfg.xLabels[p.x] || ''}: ${yFmt(p.y)}`;
        s += `<circle cx="${cx}" cy="${cy}" r="2.6" fill="${se.color}"/>`;
        s += `<circle cx="${cx}" cy="${cy}" r="9" fill="transparent" data-tip="${tip}"/>`;
      });
    });
    s += `<line x1="${mL}" y1="${mT + ph}" x2="${mL + pw}" y2="${mT + ph}" stroke="#bbb"/><line x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT + ph}" stroke="#bbb"/>`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}">${s}</svg>`;
  }

  // Grouped bar chart.
  function barsSVG(cfg) {
    const w = 680, h = cfg.h || 240, mL = 60, mR = 18, mT = 18, mB = cfg.rotateLabels ? 82 : 36;
    const pw = w - mL - mR, ph = h - mT - mB;
    const yFmt = cfg.yFmt || (v => v), yMin = cfg.yMin || 0;
    const vis = b => !(cfg.hidden && cfg.hidden.has(b.name));
    const yMax = cfg.yMax || niceMax(Math.max(...cfg.groups.flatMap(g => g.bars.filter(vis).map(b => b.v)), cfg.refLine ? cfg.refLine.y : 0, 1));
    const yPx = v => mT + ph - ((v - yMin) / ((yMax - yMin) || 1)) * ph;
    const gw = pw / cfg.groups.length, nb = (cfg.groups[0] ? cfg.groups[0].bars.filter(vis).length : 1) || 1;
    const bw = Math.min(40, (gw * 0.62) / nb), y0 = yPx(0);
    let s = '';
    for (let g = 0; g <= 4; g++) {
      const v = yMin + (yMax - yMin) * g / 4, y = yPx(v);
      s += `<line x1="${mL}" y1="${y}" x2="${mL + pw}" y2="${y}" stroke="#eee"/><text x="${mL - 8}" y="${y + 3}" text-anchor="end">${yFmt(v)}</text>`;
    }
    cfg.groups.forEach((grp, gi) => {
      const cx = mL + gw * gi + gw / 2;
      grp.bars.filter(vis).forEach((b, bi) => {
        const x = cx - (nb * bw) / 2 + bi * bw, y = yPx(b.v);
        const tip = `${grp.label}${b.name ? ' · ' + b.name : ''}: ${yFmt(b.v)}`;
        s += `<rect x="${x}" y="${Math.min(y, y0)}" width="${bw - 4}" height="${Math.abs(y0 - y)}" fill="${b.color}" rx="2" data-tip="${tip}"/>`;
        if (cfg.valLabels) s += `<text x="${x + (bw - 4) / 2}" y="${y - 4}" text-anchor="middle" fill="var(--text)">${yFmt(b.v)}</text>`;
      });
      const ly = mT + ph + (cfg.rotateLabels ? 12 : 18);
      s += cfg.rotateLabels
        ? `<text x="${cx}" y="${ly}" text-anchor="end" transform="rotate(-55 ${cx} ${ly})">${grp.label}</text>`
        : `<text x="${cx}" y="${ly}" text-anchor="middle">${grp.label}</text>`;
    });
    if (cfg.refLine) {
      const ry = yPx(cfg.refLine.y);
      s += `<line x1="${mL}" y1="${ry}" x2="${mL + pw}" y2="${ry}" stroke="${cfg.refLine.color}" stroke-width="2" stroke-dasharray="5 4" data-tip="${cfg.refLine.label}"/>`;
      s += `<text x="${mL + pw}" y="${ry - 5}" text-anchor="end" fill="${cfg.refLine.color}">${cfg.refLine.label}</text>`;
    }
    s += `<line x1="${mL}" y1="${y0}" x2="${mL + pw}" y2="${y0}" stroke="#bbb"/>`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}">${s}</svg>`;
  }

  // Bullseye scatter: SPI (x) vs CPI (y), crosshair at 1.0.
  function scatterSVG(pts) {
    const w = 680, h = 320, mL = 48, mR = 18, mT = 16, mB = 40;
    const pw = w - mL - mR, ph = h - mT - mB, lo = 0.6, hi = 1.4;
    const xPx = v => mL + ((_clamp(v, lo, hi) - lo) / (hi - lo)) * pw;
    const yPx = v => mT + ph - ((_clamp(v, lo, hi) - lo) / (hi - lo)) * ph;
    const cx = xPx(1), cy = yPx(1);
    let s = '';
    s += `<rect x="${cx}" y="${mT}" width="${mL + pw - cx}" height="${cy - mT}" fill="#e3f4ea"/>`;
    s += `<rect x="${mL}" y="${cy}" width="${cx - mL}" height="${mT + ph - cy}" fill="#fbe5e5"/>`;
    for (let v = lo; v <= hi + 1e-9; v += 0.2) {
      const x = xPx(v), y = yPx(v);
      s += `<line x1="${x}" y1="${mT}" x2="${x}" y2="${mT + ph}" stroke="#f1f1f1"/><line x1="${mL}" y1="${y}" x2="${mL + pw}" y2="${y}" stroke="#f1f1f1"/>`;
      s += `<text x="${x}" y="${mT + ph + 16}" text-anchor="middle">${v.toFixed(1)}</text><text x="${mL - 8}" y="${y + 3}" text-anchor="end">${v.toFixed(1)}</text>`;
    }
    s += `<line x1="${cx}" y1="${mT}" x2="${cx}" y2="${mT + ph}" stroke="#999"/><line x1="${mL}" y1="${cy}" x2="${mL + pw}" y2="${cy}" stroke="#999"/>`;
    const maxB = Math.max(...pts.map(p => p.bac), 1);
    pts.forEach(p => {
      const r = 4 + 6 * Math.sqrt(p.bac / maxB);
      const tip = `${p.label} (${p.wbs}) · SPI ${p.spi.toFixed(2)} · CPI ${p.cpi.toFixed(2)} · BAC ${mfmt(p.bac)}`;
      s += `<circle cx="${xPx(p.spi).toFixed(1)}" cy="${yPx(p.cpi).toFixed(1)}" r="${r.toFixed(1)}" fill="#0a6ed1" opacity="0.5" stroke="#085caf" data-tip="${tip}"/>`;
    });
    s += `<text x="${mL + pw / 2}" y="${h - 4}" text-anchor="middle">SPI →</text><text x="13" y="${mT + ph / 2}" text-anchor="middle" transform="rotate(-90 13 ${mT + ph / 2})">CPI →</text>`;
    s += `<line x1="${mL}" y1="${mT + ph}" x2="${mL + pw}" y2="${mT + ph}" stroke="#bbb"/><line x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT + ph}" stroke="#bbb"/>`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}">${s}</svg>`;
  }

  // Simulated time-phased EVM model for the current filter selection.
  function reportModel() {
    const rows = pvFilteredRows();
    const bac = rows.reduce((t, r) => t + num(r[14]), 0) || 1;
    const n = PERIODS.length;
    const sIdx = Math.max(0, PERIODS.findIndex(p => p.id === pvState.period));
    const S = t => t * t * (3 - 2 * t);
    const cpiTarget = _clamp(pvKpis(rows).cpi || 0.95, 0.80, 1.10);
    const spiTarget = _clamp(0.88 + ((Math.round(bac / 1e6) % 13) / 100), 0.85, 1.05);
    const proj = 2, total = n + proj, finishIdx = total - 1;
    const pv = [], ev = [], ac = [];
    for (let i = 0; i < n; i++) pv[i] = bac * S((i + 1) / n);
    for (let i = 0; i <= sIdx; i++) {
      const tt = sIdx ? i / sIdx : 1;
      const sp = 1 + (spiTarget - 1) * tt, cp = 1.02 + (cpiTarget - 1.02) * tt;
      ev[i] = pv[i] * sp; ac[i] = ev[i] / cp;
    }
    const evS = ev[sIdx], acS = ac[sIdx];
    const cpiNow = acS ? evS / acS : 1, spiNow = pv[sIdx] ? evS / pv[sIdx] : 1;
    const eacPlan = acS + (bac - evS);
    const eacCpi = cpiNow ? acS + (bac - evS) / cpiNow : bac;
    const eacWt = (cpiNow * spiNow) ? acS + (bac - evS) / (cpiNow * spiNow) : bac;
    const etcLine = [];
    for (let i = 0; i < total; i++)
      etcLine[i] = i < sIdx ? null : acS + (eacCpi - acS) * ((i - sIdx) / Math.max(1, finishIdx - sIdx));
    const incPV = [], incAC = [];
    for (let i = 0; i < n; i++) { incPV[i] = pv[i] - (i > 0 ? pv[i - 1] : 0); incAC[i] = i <= sIdx ? ac[i] - (i > 0 ? ac[i - 1] : 0) : 0; }
    const caRows = rows.filter(r => r[2]);
    const scatter = caRows.map((r, i) => ({
      wbs: r[2], label: r[3], bac: num(r[14]) || 1,
      spi: _clamp(spiNow + (((i * 37) % 21) - 10) / 100, 0.62, 1.38),
      cpi: _clamp(cpiNow + (((i * 53) % 21) - 10) / 100, 0.62, 1.38),
    }));
    return { n, total, sIdx, finishIdx, bac, pv, ev, ac, etcLine, eacPlan, eacCpi, eacWt,
      cpiNow, spiNow, cpiTarget, spiTarget, incPV, incAC, scatter,
      labels: [...PERIODS.map(p => p.label.replace(' 20', '’')), 'F+1', 'F+2'] };
  }

  function rcCard(title, sub, body, legend) {
    return `<div class="rc-card">
      <div class="rc-head"><span>${title}</span><span class="rc-sub">${sub}</span></div>
      <div class="rc-body">${body}${legend ? `<div class="rc-legend">${legend}</div>` : ''}</div>
    </div>`;
  }
  const lgLine = (c, t, dash) => `<span class="lg"><span class="ln" style="border-top-color:${c};${dash ? 'border-top-style:dashed;' : ''}"></span>${t}</span>`;
  const lgSw = (c, t) => `<span class="lg"><span class="sw" style="background:${c}"></span>${t}</span>`;

  // Clickable legend that toggles a chart's series on/off. State persists in
  // chartHidden across re-renders; chart builders skip any hidden series.
  const chartHidden = {};
  function toggleSeries(key, name) {
    const set = chartHidden[key] || (chartHidden[key] = new Set());
    set.has(name) ? set.delete(name) : set.add(name);
    render();
  }
  function legendToggle(key, items) {
    const hidden = chartHidden[key] || new Set();
    return items.map(it => {
      const sw = it.shape === 'sw'
        ? `<span class="sw" style="background:${it.color}"></span>`
        : `<span class="ln" style="border-top-color:${it.color};${it.dash ? 'border-top-style:dashed;' : ''}"></span>`;
      return `<span class="lg toggle${hidden.has(it.name) ? ' off' : ''}" onclick="toggleSeries('${key}','${it.name}')">${sw}${it.label || it.name}</span>`;
    }).join('');
  }

  function renderReports() {
    const m = reportModel();
    const X = m.total, L = m.labels, sx = m.sIdx;
    const pts = (arr, lim) => arr.slice(0, lim == null ? arr.length : lim).map((y, i) => ({ x: i, y }));

    // 1 · S-Curve
    const sCurve = lineSVG({
      h: 270, hidden: chartHidden['scurve'], xN: X, xLabels: L, yMax: niceMax(Math.max(m.bac, m.eacWt)), yFmt: mfmt,
      statusX: sx, refLines: [{ y: m.bac, color: '#6a6d70', dash: '4 4' }],
      series: [
        { pts: pts(m.pv, m.n), color: '#0a6ed1', name: 'PV/BCWS' },
        { pts: pts(m.ev, sx + 1), color: '#107e3e', name: 'EV/BCWP' },
        { pts: pts(m.ac, sx + 1), color: '#bb0000', name: 'AC/ACWP' },
        { pts: m.etcLine.map((y, i) => ({ x: i, y })), color: '#e9730c', dash: '5 4', name: 'EAC/ETC' },
      ],
    });
    const sLeg = legendToggle('scurve', [
      { name: 'PV/BCWS', label: 'PV / BCWS', color: '#0a6ed1' },
      { name: 'EV/BCWP', label: 'EV / BCWP', color: '#107e3e' },
      { name: 'AC/ACWP', label: 'AC / ACWP', color: '#bb0000' },
      { name: 'EAC/ETC', label: 'EAC / ETC', color: '#e9730c', dash: true },
    ]) + lgLine('#6a6d70', 'BAC', true);

    // 2 · Variance trend
    const cvCum = [], svCum = [], cvInc = [], svInc = [];
    for (let i = 0; i <= sx; i++) {
      cvCum.push({ x: i, y: m.ev[i] - m.ac[i] });
      svCum.push({ x: i, y: m.ev[i] - m.pv[i] });
      const pc = i > 0 ? m.ev[i - 1] - m.ac[i - 1] : 0, ps = i > 0 ? m.ev[i - 1] - m.pv[i - 1] : 0;
      cvInc.push({ x: i, y: (m.ev[i] - m.ac[i]) - pc });
      svInc.push({ x: i, y: (m.ev[i] - m.pv[i]) - ps });
    }
    const vmax = niceMax(Math.max(...[...cvCum, ...svCum, ...cvInc, ...svInc].map(p => Math.abs(p.y)), 1));
    const varChart = lineSVG({
      h: 240, hidden: chartHidden['variance'], xN: X, xLabels: L, yMin: -vmax, yMax: vmax, yFmt: mfmt, statusX: sx,
      refLines: [{ y: 0, color: '#bbb' }],
      series: [
        { pts: cvCum, color: '#bb0000', name: 'CV cum' }, { pts: svCum, color: '#0a6ed1', name: 'SV cum' },
        { pts: cvInc, color: '#e9730c', dash: '4 3', name: 'CV current' }, { pts: svInc, color: '#6b4ba8', dash: '4 3', name: 'SV current' },
      ],
    });
    const vLeg = legendToggle('variance', [
      { name: 'CV cum', label: 'CV cumulative', color: '#bb0000' },
      { name: 'SV cum', label: 'SV cumulative', color: '#0a6ed1' },
      { name: 'CV current', label: 'CV current period', color: '#e9730c', dash: true },
      { name: 'SV current', label: 'SV current period', color: '#6b4ba8', dash: true },
    ]);

    // 3 · CPI / SPI / TCPI trend
    const cpiPts = [], spiPts = [], tcpiPts = [];
    for (let i = 0; i <= sx; i++) {
      cpiPts.push({ x: i, y: m.ac[i] ? m.ev[i] / m.ac[i] : 1 });
      spiPts.push({ x: i, y: m.pv[i] ? m.ev[i] / m.pv[i] : 1 });
      tcpiPts.push({ x: i, y: (m.bac - m.ac[i]) ? (m.bac - m.ev[i]) / (m.bac - m.ac[i]) : 1 });
    }
    const idxChart = lineSVG({
      h: 240, hidden: chartHidden['index'], xN: X, xLabels: L, yMin: 0.7, yMax: 1.3, yFmt: v => v.toFixed(2), statusX: sx,
      bands: [{ y1: 0.95, y2: 1.05, color: '#eef7f0' }],
      refLines: [{ y: 1.0, color: '#999', dash: '4 4' }],
      series: [
        { pts: cpiPts, color: '#107e3e', name: 'CPI' }, { pts: spiPts, color: '#0a6ed1', name: 'SPI' },
        { pts: tcpiPts, color: '#e9730c', dash: '4 3', name: 'TCPI' },
      ],
    });
    const iLeg = legendToggle('index', [
      { name: 'CPI', color: '#107e3e' },
      { name: 'SPI', color: '#0a6ed1' },
      { name: 'TCPI', label: 'TCPI (to-complete)', color: '#e9730c', dash: true },
    ]) + lgSw('#eef7f0', '±0.05 control band');

    // 4 · Bullseye
    const bull = scatterSVG(m.scatter);
    const bLeg = lgSw('#e3f4ea', 'Ahead &amp; under budget') + lgSw('#fbe5e5', 'Behind &amp; over budget') +
      `<span class="lg">Bubble size = BAC · ${m.scatter.length} control accounts</span>`;

    // 5 · EAC forecasting
    const contract = m.bac * 1.03, eacColor = v => v > m.bac ? '#bb0000' : '#107e3e';
    const eacChart = barsSVG({
      h: 250, valLabels: true, yFmt: mfmt, yMax: niceMax(Math.max(m.bac, m.eacPlan, m.eacCpi, m.eacWt, contract)),
      groups: [
        { label: 'BAC', bars: [{ v: m.bac, color: '#6a6d70' }] },
        { label: 'EAC @Plan', bars: [{ v: m.eacPlan, color: eacColor(m.eacPlan) }] },
        { label: 'EAC ÷CPI', bars: [{ v: m.eacCpi, color: eacColor(m.eacCpi) }] },
        { label: 'EAC eff-wt', bars: [{ v: m.eacWt, color: eacColor(m.eacWt) }] },
        { label: 'Contract', bars: [{ v: contract, color: '#0a6ed1' }] },
      ],
    });
    const eLeg = `<span class="lg">VAC (BAC − EAC÷CPI) = ${mfmt(m.bac - m.eacCpi)}</span>` +
      lgSw('#107e3e', '≤ BAC') + lgSw('#bb0000', '> BAC') + lgSw('#0a6ed1', 'Contract value');

    // 6 · Resource / spend histogram
    const hist = barsSVG({
      h: 240, yFmt: mfmt, hidden: chartHidden['hist'],
      groups: PERIODS.map((p, i) => ({
        label: p.label.split(' ')[0],
        bars: [{ v: m.incPV[i], color: '#a9c5ec', name: 'Planned' }, { v: m.incAC[i], color: '#0a6ed1', name: 'Actual' }],
      })),
    });
    const hLeg = legendToggle('hist', [
      { name: 'Planned', label: 'Planned spend (BCWS)', color: '#a9c5ec', shape: 'sw' },
      { name: 'Actual', label: 'Actual spend (ACWP)', color: '#0a6ed1', shape: 'sw' },
    ]);

    // 7 · Internal Cost (IEAC) — DCMA Gold Card independent-EAC methods vs the official EAC.
    // Bars = different IEAC formulas; EAC is a static dashed reference line.
    const ev = m.ev[m.sIdx], ac = m.ac[m.sIdx], rem = m.bac - ev, cpi = m.cpiNow, spi = m.spiNow;
    const eacOfficial = pvFilteredRows().reduce((t, r) => t + num(r[15]), 0);
    const ieacMethods = [
      { label: '÷ CPI', v: cpi ? ac + rem / cpi : m.bac },
      { label: '÷ (CPI×SPI)', v: (cpi * spi) ? ac + rem / (cpi * spi) : m.bac },
      { label: '÷ (.8CPI+.2SPI)', v: (0.8 * cpi + 0.2 * spi) ? ac + rem / (0.8 * cpi + 0.2 * spi) : m.bac },
      { label: 'BAC ÷ CPI', v: cpi ? m.bac / cpi : m.bac },
      { label: 'ACWP + Remaining', v: ac + rem },
    ];
    const ieacGroups = ieacMethods.map(mm => ({ label: mm.label, bars: [{ name: 'iEAC', v: mm.v, color: '#efb000' }] }));
    const eacShown = !(chartHidden.ieac && chartHidden.ieac.has('EAC'));
    const ieacChart = barsSVG({
      h: 320, hidden: chartHidden.ieac, rotateLabels: true, yFmt: mfmt, groups: ieacGroups,
      refLine: eacShown ? { y: eacOfficial, color: '#107e3e', label: `EAC ${mfmt(eacOfficial)}` } : null,
    });
    const ieacLeg = legendToggle('ieac', [
      { name: 'iEAC', label: 'iEAC (independent calculations)', color: '#efb000', shape: 'sw' },
      { name: 'EAC', label: 'EAC (official forecast — reference)', color: '#107e3e' },
    ]);

    return `
      ${renderFilterBar(true)}
      <p class="module-intro">Earned-value performance for <strong>${prog().name}</strong> — status <strong>${PERIOD_MAP[pvState.period].label}</strong>. Simulated EVM data; all charts respond to the filters above.</p>
      <div class="report-charts">
        ${rcCard('1 · S-Curve — Cumulative Performance', 'BCWS / BCWP / ACWP with BAC reference &amp; EAC projection', sCurve, sLeg)}
        ${rcCard('2 · Variance Trend (CV &amp; SV)', 'Cumulative vs current-period, in dollars', varChart, vLeg)}
        ${rcCard('3 · Performance Index Trend (CPI / SPI / TCPI)', 'vs 1.0 baseline with ±0.05 control band', idxChart, iLeg)}
        ${rcCard('4 · Bullseye — SPI vs CPI', 'Control accounts vs the 1.0 / 1.0 crosshair', bull, bLeg)}
        ${rcCard('5 · EAC / Forecasting', 'Scenario family bracketed against BAC &amp; contract value', eacChart, eLeg)}
        ${rcCard('6 · Resource / Cost Histogram', 'Time-phased planned vs actual spend by period', hist, hLeg)}
        ${rcCard('7 · Internal Cost (IEAC)', 'DCMA Gold Card independent-EAC methods vs the official EAC (dashed reference line)', ieacChart, ieacLeg)}
      </div>`;
  }

  function renderRisk(p) {
    // Embed the Program Risk Register prototype, passing the selected Program's
    // projects so its left-side list reflects the current TPM Program.
    const projects = [...new Map(pvProgramRows().map(r => [r[0], r[1]])).entries()]
      .map(([id, name]) => ({ id, name }));
    const src = 'program-risk-register-prototype.html'
      + `?program=${encodeURIComponent(p.name)}`
      + `&projects=${encodeURIComponent(JSON.stringify(projects))}`;
    return `
      <div class="risk-embed-bar">
        <span class="ch-title">Program Risk Register — ${p.name}</span>
        <a class="btn" href="${src}" target="_blank">Open full screen ↗</a>
      </div>
      <iframe class="risk-frame" src="${src}" title="Program Risk Register"></iframe>`;
  }

  function renderAnalysis(p) {
    const v = p.values;
    // simple proportional bar heights vs. a $ scale
    const max = Math.max(v.bac, v.eac, v.funding) * 1.1;
    const h = n => Math.round((n / max) * 150);
    return `
      <p class="module-intro">Performance analysis for <strong>${p.name}</strong>.</p>
      <div class="placeholder-note">Illustrative analysis — charts use the same demo figures as Project Values. Real trend data to follow.</div>
      <div class="card">
        <div class="card-head"><span class="ch-title">Budget vs. Forecast vs. Funding</span></div>
        <div class="card-body">
          <div class="bars">
            <div class="bar-col"><div class="bar" style="height:${h(v.bac)}px;background:#0a6ed1"></div><div class="bar-lbl">BAC</div></div>
            <div class="bar-col"><div class="bar" style="height:${h(v.eac)}px;background:${v.eac>v.bac?'#bb0000':'#107e3e'}"></div><div class="bar-lbl">EAC</div></div>
            <div class="bar-col"><div class="bar" style="height:${h(v.acwp)}px;background:#6a6d70"></div><div class="bar-lbl">ACWP</div></div>
            <div class="bar-col"><div class="bar" style="height:${h(v.funding)}px;background:#107e3e"></div><div class="bar-lbl">Funding</div></div>
          </div>
        </div>
      </div>
      <div class="tile-grid">
        <div class="tile"><div class="t-label">CPI Trend</div>
          <div class="t-value ${v.cpi>=1?'good':'bad'}">${v.cpi.toFixed(2)}</div>
          <div class="t-sub">${v.cpi>=1?'Favorable':'Unfavorable'}</div></div>
        <div class="tile"><div class="t-label">SPI Trend</div>
          <div class="t-value ${v.spi>=1?'good':'warn'}">${v.spi.toFixed(2)}</div>
          <div class="t-sub">${v.spi>=1?'On track':'Watch'}</div></div>
        <div class="tile"><div class="t-label">Variance at Completion (VAC)</div>
          <div class="t-value ${cls(v.bac - v.eac)}">${money(v.bac - v.eac)}</div>
          <div class="t-sub">BAC − EAC</div></div>
      </div>`;
  }

  /* ---------------------------- Router -------------------------- */
  function render() {
    const p = prog();
    const c = document.getElementById('content');
    document.getElementById('secTitle').textContent = MODULE_TITLES[currentModule];
    switch (currentModule) {
      case 'values':   c.innerHTML = renderValues(p);  break;
      case 'reports':  c.innerHTML = renderReports();   break;
      case 'risk':     c.innerHTML = renderRisk(p);     break;
      case 'analysis': c.innerHTML = renderAnalysis(p); break;
    }
  }

  function setModule(mod) {
    currentModule = mod;
    pvState.wbs = '';   // WBS filter is Project-Reports-only
    document.querySelectorAll('.nav-item').forEach(el =>
      el.classList.toggle('active', el.dataset.mod === mod));
    render();
  }

  // Hover tooltip for chart data points (delegated, so it survives re-renders).
  function initChartTip() {
    const tip = document.createElement('div');
    tip.id = 'chartTip';
    document.body.appendChild(tip);
    const tipText = el => (el && el.getAttribute) ? el.getAttribute('data-tip') : null;
    document.addEventListener('mouseover', e => {
      const t = tipText(e.target);
      if (t) { tip.textContent = t; tip.style.display = 'block'; }
    });
    document.addEventListener('mousemove', e => {
      if (tip.style.display === 'block') {
        tip.style.left = (e.clientX + 14) + 'px';
        tip.style.top = (e.clientY + 14) + 'px';
      }
    });
    document.addEventListener('mouseout', e => {
      if (tipText(e.target)) tip.style.display = 'none';
    });
  }

  initChartTip();
  setModule('values');
</script>
</body>
</html>
