<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dassian TPM — Fiori</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    /* Anchor the component with a viewport-relative height, then cascade 100%
       down the UIArea / root-view / NavContainer chain so the app fills the screen.
       (The container has no data-height, so these rules are not overridden by an
       inline style.) */
    #rootComponentContainer { height: 100vh; }
    #rootComponentContainer > div { height: 100%; }
    #rootComponentContainer > div > .sapUiView { height: 100%; }
    #rootComponentContainer .sapMNav,
    #rootComponentContainer .sapMNavItem { height: 100%; }
  </style>
  <script
    id="sap-ui-bootstrap"
    src="resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resource-roots='{ "dassian.tpm.ui5": "./" }'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compat-version="edge"
    data-sap-ui-async="true"
    data-sap-ui-frame-options="trusted">
  </script>
</head>
<body class="sapUiBody">
  <div
    data-sap-ui-component
    data-id="rootComponentContainer"
    data-name="dassian.tpm.ui5"
    data-settings='{ "id": "dassian.tpm.ui5" }'>
  </div>
</body>
</html>
