<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dassian Program Risk Register — Prototype</title>
<style>
  :root {
    --sap-blue: #0a6ed1;
    --sap-blue-dark: #085caf;
    --shell-bg: #354a5f;
    --panel-border: #d9d9d9;
    --text: #32363a;
    --text-muted: #6a6d70;
    --section-bg: #f7f7f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "72", "72full", Arial, Helvetica, sans-serif;
    color: var(--text);
    background: #fff;
    font-size: 14px;
  }

  /* ---------- Shell header bar ---------- */
  .shellbar {
    display: flex;
    align-items: center;
    height: 44px;
    background: var(--shell-bg);
    color: #fff;
    padding: 0 12px;
    gap: 14px;
  }
  .shellbar .back { font-size: 18px; opacity: .85; cursor: pointer; }
  .sap-logo {
    font-weight: 700;
    font-style: italic;
    letter-spacing: 1px;
    background: #1a73c0;
    color: #fff;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 16px;
  }
  .shellbar .title {
    font-size: 15px;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .shellbar .title .chev { font-size: 11px; opacity: .8; }
  .shellbar .spacer { flex: 1; }
  .shellbar .icon { font-size: 16px; opacity: .9; cursor: pointer; }
  .shellbar .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--sap-blue);
    color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.4);
  }

  /* ---------- Body layout ---------- */
  .layout { display: flex; height: calc(100vh - 44px); }
  .sidebar {
    width: 370px;
    min-width: 370px;
    border-right: 1px solid var(--panel-border);
    display: flex; flex-direction: column;
    background: #fff;
  }
  .panel-header {
    text-align: center;
    padding: 10px;
    font-size: 15px;
    color: var(--text);
    border-bottom: 1px solid var(--panel-border);
    background: #fff;
  }
  .program-list { overflow-y: auto; flex: 1; }
  .program-card {
    padding: 12px 16px;
    border-bottom: 1px solid #ededed;
    cursor: pointer;
  }
  .program-card:hover { background: #f5f8fc; }
  .program-card.active { background: #eaf2fb; border-left: 3px solid var(--sap-blue); }
  .program-card .pid { font-size: 13px; color: var(--text); }
  .program-card .pname { font-size: 15px; color: var(--text); margin: 2px 0 8px; }
  .program-card .meta { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

  /* ---------- Main content ---------- */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; border-left: 3px solid var(--sap-blue); }
  .section-bar {
    display: flex; align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--panel-border);
    background: #fff;
  }
  .section-bar .sec-title { flex: 1; text-align: center; font-size: 15px; }
  .section-bar .actions { display: flex; align-items: center; gap: 14px; color: var(--sap-blue); }
  .btn-link {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--sap-blue);
    color: var(--sap-blue);
    background: #fff;
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .section-bar .icon-btn { color: var(--sap-blue); cursor: pointer; font-size: 16px; }
  .section-bar .icon-btn.close { color: #5b738b; }

  .content { flex: 1; overflow-y: auto; padding: 18px 28px; }

  .content-top {
    display: flex; align-items: center; margin-bottom: 8px;
  }
  .program-title { font-size: 18px; font-weight: 400; flex: 1; }

  /* ---------- Segmented toggle ---------- */
  .segmented {
    display: inline-flex;
    border: 1px solid var(--sap-blue);
    border-radius: 6px;
    overflow: hidden;
  }
  .segmented button {
    border: none;
    background: #fff;
    color: var(--sap-blue);
    padding: 7px 22px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .segmented button + button { border-left: 1px solid var(--sap-blue); }
  .segmented button.active { background: var(--sap-blue); color: #fff; }
  .segmented.opps button { border-color: #6b4ba8; color: #6b4ba8; }
  .segmented.opps button + button { border-left-color: #6b4ba8; }
  .segmented.opps button.active { background: #6b4ba8; color: #fff; }

  /* ---------- Heat map ---------- */
  .heat-wrap {
    display: flex;
    margin: 18px 0 6px;
  }
  .y-title {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding-right: 6px;
    align-self: center;
  }
  .row-labels {
    display: flex; flex-direction: column;
    width: 86px;
  }
  .row-labels .rl {
    flex: 1;
    display: flex; align-items: center; justify-content: flex-end;
    color: var(--text-muted);
    font-size: 12px;
    padding-right: 10px;
  }
  .row-labels .rl span { transform: rotate(-30deg); transform-origin: right center; white-space: nowrap; }

  .matrix-area { flex: 1; }
  .matrix {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
  }
  .cell {
    height: 66px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    font-weight: 400;
    color: #1d1d1d;
  }
  .col-labels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 10px;
    height: 46px;
  }
  .col-labels .cl {
    display: flex; align-items: flex-start; justify-content: center;
    color: var(--text-muted);
    font-size: 12px;
  }
  .col-labels .cl span { transform: rotate(-30deg); transform-origin: center top; white-space: nowrap; }
  .x-title {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin: 8px 0 4px;
    /* offset to align with matrix center (account for y-title + row-labels width) */
    padding-left: 100px;
  }

  /* ---------- Risk table ---------- */
  .table-head-row {
    display: flex; align-items: center;
    margin: 26px 0 4px;
  }
  .table-head-row .tbl-title { font-size: 16px; font-weight: 400; flex: 1; }
  .table-toolbar { display: flex; align-items: center; gap: 14px; color: var(--sap-blue); }
  .table-toolbar .ti { cursor: pointer; font-size: 15px; }
  .table-toolbar .search {
    display: flex; align-items: center;
    border: 1px solid #c4c4c4; border-radius: 4px;
    padding: 3px 8px; color: var(--text-muted);
  }
  .table-toolbar .search input { border: none; outline: none; font-family: inherit; font-size: 13px; width: 150px; }

  table.risk { width: 100%; border-collapse: collapse; }
  table.risk th {
    text-align: left;
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    padding: 12px 10px;
    border-bottom: 1px solid var(--panel-border);
  }
  table.risk td {
    padding: 12px 10px;
    border-bottom: 1px solid #ededed;
    font-size: 13px;
  }
  td.score-bad { color: #c0271a; }
  td.score-opp { color: #6b4ba8; }
  td.score-good { color: #107e3e; }

  /* ---------- Risk detail slide-out ---------- */
  table.risk tbody tr { cursor: pointer; }
  table.risk tbody tr:hover td { background: #f5f8fc; }
  body.detail-open .sidebar { display: none; }

  .detail-drawer {
    position: absolute; top: 44px; right: 0; bottom: 0;
    width: min(640px, 62%);
    background: #f7f7f7; border-left: 1px solid var(--panel-border);
    box-shadow: -6px 0 18px rgba(0,0,0,.14);
    transform: translateX(101%); transition: transform .25s ease;
    display: flex; flex-direction: column; z-index: 50;
  }
  .detail-drawer.open { transform: translateX(0); }
  .dd-header { background: #eaf1f8; padding: 14px 18px; border-bottom: 1px solid var(--panel-border); display: flex; align-items: flex-start; gap: 14px; }
  .dd-icon { width: 46px; height: 46px; border-radius: 50%; background: var(--sap-blue); color: #fff; font-weight: 700; font-size: 26px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .dd-htext { flex: 1; }
  .dd-title { font-size: 19px; font-weight: 400; color: var(--text); }
  .dd-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .dd-close { cursor: pointer; font-size: 18px; color: #5b738b; }
  .dd-tabs { display: flex; background: #eaf1f8; border-bottom: 1px solid var(--panel-border); padding: 0 10px; overflow-x: auto; }
  .dd-tab { padding: 10px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; color: var(--text); }
  .dd-tab.active { border-bottom-color: var(--sap-blue); color: var(--sap-blue); font-weight: 700; }
  .dd-body { overflow-y: auto; flex: 1; padding: 18px 22px; }
  .dd-section { margin-bottom: 30px; }
  .dd-section h3 { font-size: 16px; font-weight: 400; margin: 0 0 14px; border-bottom: 1px solid #ededed; padding-bottom: 6px; }
  .dd-field { display: flex; align-items: flex-start; margin-bottom: 10px; }
  .dd-field label { width: 180px; min-width: 180px; text-align: right; padding-right: 14px; padding-top: 7px; color: var(--text); font-size: 13px; }
  .dd-field .val { flex: 1; border: 1px solid #c4c4c4; border-radius: 4px; padding: 7px 10px; font-size: 13px; background: #fff; }
  .dd-field .val.ro { background: #f2f2f2; color: var(--text-muted); }
  .dd-suffix { margin-left: 8px; padding-top: 7px; color: var(--text-muted); font-size: 13px; }
  table.dd-tasks { width: 100%; border-collapse: collapse; }
  table.dd-tasks th { text-align: left; font-weight: 700; font-size: 12px; padding: 9px 10px; border-bottom: 1px solid var(--panel-border); }
  table.dd-tasks td { padding: 9px 10px; border-bottom: 1px solid #ededed; font-size: 13px; }
  .dd-empty { color: var(--text-muted); font-size: 13px; }
  svg.wf { width: 100%; height: auto; display: block; }
  .wf-legend { display: flex; gap: 22px; justify-content: center; margin-top: 10px; font-size: 12px; color: var(--text-muted); }
  .wf-legend .ln { display: inline-block; width: 20px; height: 3px; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>

  <!-- Shell bar -->
  <div class="shellbar">
    <span class="back">‹</span>
    <span class="sap-logo">SAP</span>
    <span class="title">Dassian Program Risk Register <span class="chev">▾</span></span>
    <span class="spacer"></span>
    <span class="icon">🔍</span>
    <span class="icon">🔔</span>
    <span class="avatar">JB</span>
  </div>

  <div class="layout">
    <!-- Sidebar: program list -->
    <aside class="sidebar">
      <div class="panel-header" id="panelHeader">Program List</div>
      <div class="program-list" id="programList"></div>
    </aside>

    <!-- Main content -->
    <section class="main">
      <div class="section-bar">
        <div class="actions" style="visibility:hidden">x</div>
        <div class="sec-title" id="secTitle">Program Risks</div>
        <div class="actions">
          <span class="btn-link">⧉ To Project Burndown</span>
          <span class="icon-btn">⤢</span>
          <span class="icon-btn close">✕</span>
        </div>
      </div>

      <div class="content">
        <div class="content-top">
          <div class="program-title">PPC/SIS Demo 1 (JTB001)</div>
          <div class="segmented" id="segmented">
            <button id="btnRisks" class="active" onclick="setView('risks')">Risks</button>
            <button id="btnOpps" onclick="setView('opportunities')">Opportunities</button>
          </div>
        </div>

        <!-- Heat map -->
        <div class="heat-wrap">
          <div class="y-title" id="yTitle">Risk Probability</div>
          <div class="row-labels" id="rowLabels"></div>
          <div class="matrix-area">
            <div class="matrix" id="matrix"></div>
            <div class="col-labels" id="colLabels"></div>
          </div>
        </div>
        <div class="x-title" id="xTitle">Risk Impact</div>

        <!-- Table -->
        <div class="table-head-row">
          <div class="tbl-title" id="tblTitle">Risks(3/3)</div>
          <div class="table-toolbar">
            <span class="ti">⇅</span>
            <span class="ti">▽</span>
            <span class="ti">⊟</span>
            <span class="ti">⧨</span>
            <span class="search"><input type="text" placeholder="Search"> 🔍</span>
          </div>
        </div>
        <table class="risk">
          <thead>
            <tr id="tblHead"></tr>
          </thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Risk detail slide-out (filled by JS on row click) -->
  <div class="detail-drawer" id="detailDrawer"></div>

<script>

    [2, 3, 4, 5, 5],

      ],
      opportunities: [
        mkItem({ kind: 'opportunity', shortDesc: 'Opportunity A', description: 'Reuse training simulator across sites.', type: 'Opportunity',
          owner: 'Tim LaRue', dateRaised: '04/22/2026', workPackage: 'DD-0002.1.5 - Training',
          riskValue: 350000, originalValue: 350000, currentValue: 350000, targetValue: 70000,
          cause: 'Simulator built for one site', event: 'Containerize for multi-site deployment', effect: 'Avoided duplicate build cost',
          probability: 'Unlikely', impact: 'Significant', originalScore: 0.24, currentScore: 0.24, targetScore: 0.05,
          mitigationPlan: 'Containerize the simulator for multi-site deployment.', lastReviewed: '05/02/2026' }),
      ],
    },
    'DD-0003': {
      risks: [
        mkItem({ shortDesc: 'Risk A', description: 'Site activation permits delayed.', owner: 'EHAYES', dateRaised: '05/01/2026',
          workPackage: 'DD-0003.1 - Air Vehicle', riskValue: 450000, originalValue: 450000, currentValue: 450000, targetValue: 90000,
          cause: 'Local permitting backlog', event: 'Permits not granted on time', effect: 'Activation milestone slips',
          probability: 'Likely', impact: 'Significant', originalScore: 0.48, currentScore: 0.48, targetScore: 0.10,
          mitigationPlan: 'Submit permit applications early with expedite fees.', lastReviewed: '05/10/2026' }),
      ],
      opportunities: [],
    },
    'DD-0010': {
      risks: [
        mkItem({ shortDesc: 'Risk A', description: 'Baseline rollup data quality.', dateRaised: '05/05/2026',
          riskValue: 200000, originalValue: 200000, currentValue: 200000, targetValue: 40000,
          cause: 'Demo dataset incomplete', event: 'Rollups show gaps', effect: 'Reporting rework',
          probability: 'Unlikely', impact: 'Modest', originalScore: 0.12, currentScore: 0.12, targetScore: 0.03,
          mitigationPlan: 'Validate the demo dataset before reporting.', lastReviewed: '05/10/2026' }),
      ],
      opportunities: [],
    },
  };

  // ---- Backfill PMBOK-conventional register fields ----
  // The PMBOK Guide risk register conventionally carries a unique Risk ID, a
  // risk Category (from the Risk Breakdown Structure), a typed Response Strategy
  // and Triggers/warning signs. These are assigned here so every entry aligns
  // with those contents. Threat strategies: Avoid/Transfer/Mitigate/Accept/
  // Escalate; opportunity strategies: Exploit/Share/Enhance/Accept/Escalate.
  const RISK_META = {
    'Design of the fuselage is not correct.':        ['Technical — Design', 'Mitigate', 'Design review flags out-of-tolerance measurements; cross-team design mismatch reported'],
    'Supplier delivery of avionics is at risk.':     ['External — Suppliers / Subcontractors', 'Transfer', 'Supplier misses an interim milestone; quoted lead time extends'],
    'Software integration may exceed schedule.':     ['Technical — Software Integration', 'Mitigate', 'Nightly build failures rise; integration-defect backlog grows'],
    'Tooling availability for assembly.':            ['Organizational — Resources', 'Mitigate', 'A competing program reserves shared tooling in the assembly window'],
    'Re-use existing test harness to cut cost.':     ['Technical — Reuse / Efficiency', 'Exploit', 'Early spike confirms the harness is compatible'],
    'Air vehicle structural margin is thin.':        ['Technical — Structures', 'Mitigate', 'Coupon-test results trend below allowable margin'],
    'Industrial facility readiness.':                ['Organizational — Facilities', 'Mitigate', 'Facility-upgrade milestone slips past the readiness need date'],
    'Bulk-buy raw materials for a discount.':        ['External — Procurement', 'Exploit', 'Supplier opens a volume-pricing window'],
    'Training material lags schedule.':              ['Organizational — Staffing', 'Mitigate', 'SME hours booked below plan; courseware drafts fall behind'],
    'Data deliverable format change.':               ['External — Customer / Requirements', 'Mitigate', 'Customer signals a CDRL format revision in review comments'],
    'Reuse training simulator across sites.':        ['Technical — Reuse', 'Enhance', 'A second site requests simulator access'],
    'Site activation permits delayed.':              ['External — Regulatory / Permitting', 'Mitigate', 'Permit application enters the backlog queue; authority response overdue'],
    'Baseline rollup data quality.':                 ['Project Management — Data / Reporting', 'Mitigate', 'Rollup reconciliation shows gaps versus source extracts'],
  };
  Object.keys(RISK_DB).forEach(pid => {
    const db = RISK_DB[pid];
    const apply = (it, seq, prefix, dflt) => {
      it.riskId = it.riskId || (pid + '-' + prefix + String(seq).padStart(2, '0'));
      const m = RISK_META[it.description];
      if (m) { it.category = it.category || m[0]; it.responseStrategy = it.responseStrategy || m[1]; it.triggers = it.triggers || m[2]; }
      if (!it.responseStrategy) it.responseStrategy = dflt;
    };
    (db.risks || []).forEach((it, i) => apply(it, i + 1, 'R', 'Mitigate'));
    (db.opportunities || []).forEach((it, i) => apply(it, i + 1, 'O', 'Enhance'));
  });

  // ---- State ----
  let currentProjectId = null;
  let projectList = [];

  function items() {
    const db = RISK_DB[currentProjectId] || { risks: [], opportunities: [] };
    return current === 'opportunities' ? db.opportunities : db.risks;
  }
  function computeCounts(list) {
    const c = Array.from({ length: 5 }, () => [0, 0, 0, 0, 0]);
    list.forEach(it => {
      const r = PROB.indexOf(it.probability), col = IMPACT.indexOf(it.impact);
      if (r >= 0 && col >= 0) c[r][col]++;
    });
    return c;
  }
  const fmtScore = n => (Math.round(n * 100) / 100).toFixed(2);

  // default to risks, but allow ?view=opportunities for direct/linked rendering
  let current = new URLSearchParams(location.search).get('view') === 'opportunities' ? 'opportunities' : 'risks';

  function render() {
    const v = VIEW_META[current];
    const list = items();
    const counts = computeCounts(list);

    document.getElementById('secTitle').textContent = v.sectionTitle;
    document.getElementById('tblTitle').textContent = v.tableTitle + '(' + list.length + '/' + list.length + ')';

    // Matrix
    const matrix = document.getElementById('matrix');
    matrix.innerHTML = '';
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        const tier = TIER[r][c];
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.background = v.palette[tier];
        cell.style.color = v.whiteTextTiers.includes(tier) ? '#fff' : '#1d1d1d';
        cell.textContent = counts[r][c];
        matrix.appendChild(cell);
      }
    }

    // Axis labels
    const rl = document.getElementById('rowLabels');
    rl.innerHTML = '';
    PROB.forEach(p => { const d = document.createElement('div'); d.className = 'rl'; d.innerHTML = '<span>' + p + '</span>'; rl.appendChild(d); });
    const cl = document.getElementById('colLabels');
    cl.innerHTML = '';
    IMPACT.forEach(i => { const d = document.createElement('div'); d.className = 'cl'; d.innerHTML = '<span>' + i + '</span>'; cl.appendChild(d); });

    // Table
    document.getElementById('tblHead').innerHTML =
      '<th>ID</th><th>' + v.descHeader + '</th><th>Category</th><th>Date Raised</th><th>Owner</th><th>Status</th>' +
      '<th>Original Score</th><th>Current Score</th><th>Target Score</th>';
    const body = document.getElementById('tblBody');
    body.innerHTML = '';
    list.forEach(it => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + it.riskId + '</td><td>' + it.shortDesc + '</td><td>' + it.category + '</td><td>' + it.dateRaised + '</td><td>' + it.owner + '</td><td>' + it.status + '</td>' +
        '<td class="' + v.scoreClass + '">' + fmtScore(it.originalScore) + '</td>' +
        '<td class="' + v.scoreClass + '">' + fmtScore(it.currentScore) + '</td>' +
        '<td class="score-good">' + fmtScore(it.targetScore) + '</td>';
      tr.onclick = () => openDetail(it);
      body.appendChild(tr);
    });
  }

  function setView(view) {
    current = view;
    document.getElementById('btnRisks').classList.toggle('active', view === 'risks');
    document.getElementById('btnOpps').classList.toggle('active', view === 'opportunities');
    document.getElementById('segmented').classList.toggle('opps', view === 'opportunities');
    closeDetail();
    render();
  }

  function selectProject(i) {
    document.querySelectorAll('.program-card').forEach((c, idx) => c.classList.toggle('active', idx === i));
    const p = projectList[i];
    currentProjectId = p.id;
    document.querySelector('.program-title').textContent = p.name + ' (' + p.id + ')';
    closeDetail();
    render();
  }

  // ---- Detail slide-out ----
  const money = n => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function field(label, value, ro) {
    return '<div class="dd-field"><label>' + label + '</label><div class="val' + (ro ? ' ro' : '') + '">' + (value || '') + '</div></div>';
  }
  function moneyField(label, value, ro) {
    return '<div class="dd-field"><label>' + label + '</label><div class="val' + (ro ? ' ro' : '') + '">' + money(value) + '</div><span class="dd-suffix">USD</span></div>';
  }

  function openDetail(it) {
    const d = document.getElementById('detailDrawer');
    d.innerHTML = detailHtml(it);
    document.body.classList.add('detail-open');
    d.classList.add('open');
  }
  function closeDetail() {
    const d = document.getElementById('detailDrawer');
    if (d) d.classList.remove('open');
    document.body.classList.remove('detail-open');
  }

  function detailHtml(it) {
    const tabs = [['det', 'RISK DETAILS'], ['sco', 'SCORING'], ['mit', 'MITIGATION'], ['tsk', 'TASKS'], ['wat', 'WATERFALL']];
    const tabHtml = tabs.map((t, i) =>
      '<span class="dd-tab' + (i === 0 ? ' active' : '') + '" onclick="ddTab(\'' + t[0] + '\', this)">' + t[1] + '</span>').join('');
    const tasks = it.tasks || [];
    const taskRows = tasks.map(t =>
      '<tr><td>' + t.desc + '</td><td>' + t.start + '</td><td>' + t.end + '</td><td>' + t.assigned + '</td>' +
      '<td class="score-good">' + fmtScore(t.targetScore) + '</td><td>' + t.status + '</td><td>' + money(t.targetValue) + ' USD</td></tr>').join('');
    return '' +
      '<div class="dd-header">' +
        '<div class="dd-icon">!</div>' +
        '<div class="dd-htext"><div class="dd-title">' + it.description + '</div>' +
          '<div class="dd-sub">Status: ' + it.status + '</div>' +
          '<div class="dd-sub">Requires Approval: ' + it.requiresApproval + '</div></div>' +
        '<span class="dd-close" onclick="closeDetail()">✕</span>' +
      '</div>' +
      '<div class="dd-tabs">' + tabHtml + '</div>' +
      '<div class="dd-body">' +
        '<div class="dd-section" id="dd-det"><h3>Risk Details</h3>' +
          field('Risk ID', it.riskId, true) + field('Short Description', it.shortDesc) + field('Description', it.description) +
          field('Project ID', currentProjectId, true) + field('Category (RBS)', it.category) + field('Work Package', it.workPackage) +
          field('Performance Obligation WBS', it.poWbs) + field('Type', it.type) + field('Status', it.status) +
          field('Owner', it.owner) + field('Date Raised', it.dateRaised, true) + field('Date Closed', it.dateClosed, true) +
          moneyField('Risk Value', it.riskValue) + moneyField('Original Value', it.originalValue, true) +
          moneyField('Current Mitigated Value', it.currentValue, true) + moneyField('Target Value', it.targetValue, true) +
          field('Cause', it.cause) + field('Event', it.event) + field('Effect', it.effect) +
        '</div>' +
        '<div class="dd-section" id="dd-sco"><h3>Scoring</h3>' +
          field('Probability', it.probability) + field('Impact', it.impact) +
          field('Original Score', fmtScore(it.originalScore), true) + field('Current Score', fmtScore(it.currentScore), true) +
          field('Target Score', fmtScore(it.targetScore), true) +
        '</div>' +
        '<div class="dd-section" id="dd-mit"><h3>Mitigation</h3>' +
          field('Response Strategy', it.responseStrategy) +
          '<div class="dd-field"><label>Mitigation Plan</label><div class="val" style="min-height:56px">' + (it.mitigationPlan || '') + '</div></div>' +
          '<div class="dd-field"><label>Triggers / Warning Signs</label><div class="val" style="min-height:44px">' + (it.triggers || '') + '</div></div>' +
          field('Last Reviewed Date', it.lastReviewed, true) +
        '</div>' +
        '<div class="dd-section" id="dd-tsk"><h3>Tasks(' + tasks.length + '/' + tasks.length + ')</h3>' +
          (taskRows ? '<table class="dd-tasks"><thead><tr><th>Description</th><th>Start Date</th><th>End Date</th><th>Assigned To</th><th>Target Score</th><th>Status</th><th>Target Value</th></tr></thead><tbody>' + taskRows + '</tbody></table>' : '<div class="dd-empty">No mitigation tasks.</div>') +
        '</div>' +
        '<div class="dd-section" id="dd-wat"><h3>Waterfall</h3>' + waterfallSvg(it) + '</div>' +
      '</div>';
  }

  function ddTab(id, el) {
    document.querySelectorAll('.dd-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const sec = document.getElementById('dd-' + id);
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Risk-score waterfall: red/yellow/green bands + a stepped "Current" line that
  // drops through each mitigation task's target score, plus the "Original" baseline.
  function waterfallSvg(it) {
    const W = 600, H = 250, mL = 38, mR = 16, mT = 12, mB = 42;
    const pw = W - mL - mR, ph = H - mT - mB;
    const yPx = s => mT + ph - s * ph;
    const pts = [{ t: 0, s: it.originalScore }];
    (it.tasks || []).forEach((tk, i) => pts.push({ t: i + 1, s: tk.targetScore }));
    if (pts.length === 1) pts.push({ t: 1, s: it.targetScore });
    const span = pts.length - 1 + 4;                 // leave timeline room to the right
    const xPx = t => mL + (t / span) * pw;
    let s = '';
    // bands: red 0.4-1.0, yellow 0.2-0.4, green 0-0.2
    s += '<rect x="' + mL + '" y="' + yPx(1) + '" width="' + pw + '" height="' + (yPx(0.4) - yPx(1)) + '" fill="#e12219"/>';
    s += '<rect x="' + mL + '" y="' + yPx(0.4) + '" width="' + pw + '" height="' + (yPx(0.2) - yPx(0.4)) + '" fill="#e2df1e"/>';
    s += '<rect x="' + mL + '" y="' + yPx(0.2) + '" width="' + pw + '" height="' + (yPx(0) - yPx(0.2)) + '" fill="#2e7d0e"/>';
    for (let g = 0; g <= 10; g += 2) { const sc = g / 10, y = yPx(sc); s += '<text x="' + (mL - 6) + '" y="' + (y + 3) + '" text-anchor="end" font-size="10" fill="#6a6d70">' + sc.toFixed(1) + '</text>'; }
    // Original baseline (flat, dashed blue)
    s += '<line x1="' + xPx(0) + '" y1="' + yPx(it.originalScore) + '" x2="' + xPx(span) + '" y2="' + yPx(it.originalScore) + '" stroke="#5b9bd5" stroke-width="2" stroke-dasharray="6 4"/>';
    // Current stepped line (black)
    let path = 'M' + xPx(pts[0].t) + ',' + yPx(pts[0].s);
    for (let i = 1; i < pts.length; i++) path += ' L' + xPx(pts[i - 1].t) + ',' + yPx(pts[i].s) + ' L' + xPx(pts[i].t) + ',' + yPx(pts[i].s);
    path += ' L' + xPx(span) + ',' + yPx(pts[pts.length - 1].s);
    s += '<path d="' + path + '" fill="none" stroke="#1d1d1d" stroke-width="2.5"/>';
    pts.forEach(p => { s += '<circle cx="' + xPx(p.t) + '" cy="' + yPx(p.s) + '" r="3.5" fill="#5b9bd5"/>'; });
    // Today's Date marker
    const tx = xPx(span - 0.5);
    s += '<line x1="' + tx + '" y1="' + mT + '" x2="' + tx + '" y2="' + (mT + ph) + '" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>';
    s += '<text x="' + (mL + pw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="#6a6d70">Mitigation Tasks over Time</text>';
    s += '<text x="11" y="' + (mT + ph / 2) + '" text-anchor="middle" font-size="11" fill="#6a6d70" transform="rotate(-90 11 ' + (mT + ph / 2) + ')">Risk Score</text>';
    return '<svg class="wf" viewBox="0 0 ' + W + ' ' + H + '">' + s + '</svg>' +
      '<div class="wf-legend">' +
        '<span><span class="ln" style="background:#1d1d1d"></span>Current</span>' +
        '<span><span class="ln" style="height:0;border-top:3px dashed #5b9bd5"></span>Original</span>' +
        '<span><span class="ln" style="height:0;border-top:3px dashed #9aa0a6"></span>Today\'s Date</span>' +
      '</div>';
  }

  // ---- Init: project list driven by the parent TPM springboard ----
  // The springboard passes ?program=<name>&projects=<JSON [{id,name}]>. Falls
  // back to a default list when opened standalone.
  (function () {
    const params = new URLSearchParams(location.search);
    const programName = params.get('program');
    try { projectList = JSON.parse(params.get('projects') || '[]'); } catch (e) { projectList = []; }
    if (!projectList.length) {
      projectList = [
        { id: 'JTB001', name: 'PPC/SIS Demo 1' },
        { id: 'DD-0001', name: 'CP,PPC,RAP,FPA,PACE,SIS MSP,FD Dmo Prj' },
      ];
    }
    if (programName) document.getElementById('panelHeader').textContent = programName + ' — Projects';
    const list = document.getElementById('programList');
    list.innerHTML = '';
    projectList.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'program-card';
      card.innerHTML = '<div class="pid">' + p.id + '</div><div class="pname">' + p.name + '</div>'
        + '<div class="meta">Controlling Area: A000<br>Plant: 1710</div>';
      card.onclick = () => selectProject(i);
      list.appendChild(card);
    });
    selectProject(0);
    setView(current);
  })();
</script>
